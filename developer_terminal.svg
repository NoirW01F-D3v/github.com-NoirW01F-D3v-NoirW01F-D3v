<?xml version="1.0" encoding="UTF-8"?>
<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 256 256"
  width="256"
  height="256"
  fill="none">

  <title>Developer API Icon</title>
  <desc>A code bracket icon with a connected API node symbol</desc>

  <!-- Background -->
  <rect width="256" height="256" rx="48" fill="#111827"/>

  <!-- Code brackets -->
  <path
    d="M78 72L38 112L78 152"
    stroke="#60A5FA"
    stroke-width="14"
    stroke-linecap="round"
    stroke-linejoin="round"/>

  <path
    d="M178 72L218 112L178 152"
    stroke="#60A5FA"
    stroke-width="14"
    stroke-linecap="round"
    stroke-linejoin="round"/>

  <!-- Slash -->
  <path
    d="M146 58L110 166"
    stroke="#F9FAFB"
    stroke-width="12"
    stroke-linecap="round"/>

  <!-- API connection nodes -->
  <circle cx="128" cy="112" r="22" fill="#10B981"/>

  <circle cx="128" cy="112" r="8" fill="#111827"/>

  <path
    d="M128 90V70M128 134V154M106 112H86M150 112H170"
    stroke="#10B981"
    stroke-width="8"
    stroke-linecap="round"/>

  <!-- Small node points -->
  <circle cx="128" cy="70" r="6" fill="#10B981"/>
  <circle cx="128" cy="154" r="6" fill="#10B981"/>
  <circle cx="86" cy="112" r="6" fill="#10B981"/>
  <circle cx="170" cy="112" r="6" fill="#10B981"/>

</svg>

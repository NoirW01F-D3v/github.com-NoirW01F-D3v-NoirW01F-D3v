<svg width="900" height="350" viewBox="0 0 900 350"
xmlns="http://www.w3.org/2000/svg">

<defs>
  <filter id="glow">
    <feGaussianBlur stdDeviation="3"/>
  </filter>

  <linearGradient id="bg" x2="0" y2="1">
    <stop stop-color="#050014"/>
    <stop offset="1" stop-color="#000000"/>
  </linearGradient>
</defs>

<!-- Space -->
<rect width="900" height="350" fill="url(#bg)"/>

<!-- Stars -->
<g fill="#fff">
  <circle cx="80" cy="50" r="2">
    <animate attributeName="cy" from="50" to="380" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="220" cy="20" r="1.5">
    <animate attributeName="cy" from="20" to="370" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="430" cy="90" r="2">
    <animate attributeName="cy" from="90" to="400" dur="5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="700" cy="30" r="2">
    <animate attributeName="cy" from="30" to="380" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="820" cy="120" r="1.5">
    <animate attributeName="cy" from="120" to="400" dur="3.5s" repeatCount="indefinite"/>
  </circle>
</g>

<!-- Terminal window -->
<rect x="120" y="55" width="660" height="230"
rx="12"
fill="#020202"
stroke="#00ff88"
stroke-width="2"/>

<!-- Terminal glow -->
<rect x="120" y="55" width="660" height="230"
rx="12"
fill="none"
stroke="#00ff88"
opacity=".3"
filter="url(#glow)"/>

<!-- Text -->
<g font-family="monospace" font-size="20" fill="#00ff88">

<text x="150" y="100">
> INITIALIZING system core...
</text>

<text x="150" y="135">
> LOADING hidden code list...
</text>

<text x="150" y="170">
> CONNECTING to NoirW01Fs Read.Me ...
</text>

<text x="150" y="205">
> GITHUB Read.Me  ONLINE_$$
</text>

<text x="150" y="250" fill="#ffffff">
GALAXY_OS v2.0
</text>

</g>

<!-- Blinking cursor -->
<rect x="320" y="232" width="12" height="20" fill="#00ff88">
<animate attributeName="opacity"
values="1;0;1"
dur="1s"
repeatCount="indefinite"/>
</rect>

<!-- Rocket -->
<g transform="translate(450 300)">
<path d="M0 0 Q20 -80 40 0Z"
fill="#ddd"/>
<circle cx="20" cy="-25" r="8" fill="#00ffff"/>
<path d="M10 5 L20 35 L30 5"
fill="#ff5500">
<animate attributeName="d"
values="M10 5 L20 35 L30 5;
M10 5 L20 55 L30 5;
M10 5 L20 35 L30 5"
dur=".5s"
repeatCount="indefinite"/>
</path>
</g>

</svg>

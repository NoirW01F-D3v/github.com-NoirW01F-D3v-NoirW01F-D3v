<svg width="900" height="300" viewBox="0 0 900 300" xmlns="http://www.w3.org/2000/svg">

<defs>
  <linearGradient id="bg" x2="0" y2="1">
    <stop stop-color="#050816"/>
    <stop offset="1" stop-color="#000000"/>
  </linearGradient>

  <filter id="glow">
    <feGaussianBlur stdDeviation="3" result="blur"/>
    <feMerge>
      <feMergeNode in="blur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>
</defs>

<!-- Background -->
<rect width="900" height="300" fill="url(#bg)"/>

<!-- Stars -->
<g fill="#ffffff">
  <circle cx="80" cy="40" r="2"/>
  <circle cx="160" cy="90" r="1"/>
  <circle cx="300" cy="50" r="2"/>
  <circle cx="500" cy="80" r="1"/>
  <circle cx="720" cy="40" r="2"/>
  <circle cx="820" cy="120" r="1"/>
</g>

<!-- Terminal window -->
<rect x="80" y="45" width="740" height="190"
rx="12"
fill="#020202"
stroke="#00ff88"
stroke-width="2"
filter="url(#glow)"/>

<!-- Terminal dots -->
<circle cx="110" cy="75" r="7" fill="#f2525"/>
<circle cx="135" cy="75" r="7" fill="#fBBa00"/>
<circle cx="160" cy="75" r="7" fill="#22ff55"/>

<!-- Terminal text -->
<g font-family="monospace" font-size="20" fill="#00ff88">

<text x="110" y="120">
&gt; Booting GitHub Read.Me 
</text>

<text x="110" y="155">
&gt; loading skills: Android Development | Linux && SQL, Java, Py, etc.... | Studying Cyber-Security
</text>

<text x="110" y="190">
&gt; status: ONLINE_
</text>

</g>

<!-- Cursor blink -->
<rect x="390" y="172" width="12" height="22" fill="#00ff88">
  <animate attributeName="opacity"
  values="1;0;1"
  dur="1s"
  repeatCount="indefinite"/>
</rect>


<!-- Title -->
<text x="450" y="285"
text-anchor="middle"
font-family="monospace"
font-size="24"
fill="#ffffff">
CYBER // SPACE TERMINAL
</text>

</svg>

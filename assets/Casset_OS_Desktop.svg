<defs>

<style>

.txt {
font-family:"Segoe UI",Arial,sans-serif;
fill:#f4f7ff;
}

.title {
font-size:32px;
font-weight:bold;
}

.label {
font-size:20px;
}

.small {
font-size:15px;
fill:#b9c7dd;
}

.window {
fill:#151a28;
stroke:#6d7cff;
stroke-width:2;
}

.glass {
fill:#101522;
fill-opacity:.85;
}

.button {
fill:#20283c;
stroke:#8996ff;
stroke-width:1;
}

</style>


<linearGradient id="wall"
x2="0"
y2="1">

<stop stop-color="#10152a"/>
<stop offset="1" stop-color="#202d4a"/>

</linearGradient>


<linearGradient id="bar">

<stop stop-color="#171c2c"/>
<stop offset="1" stop-color="#090c15"/>

</linearGradient>


</defs>



<svg width="1200" height="350" viewBox="0 0 1200 350" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#050816"/>
      <stop offset="1" stop-color="#0D1B2A"/>
    </linearGradient>

    <linearGradient id="accent" x1="0" x2="1">
      <stop stop-color="#00FF9C"/>
      <stop offset="1" stop-color="#00C2FF"/>
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="350" rx="24" fill="url(#bg)"/>

  <!-- Grid -->
  <g opacity="0.08" stroke="#00FF9C">
    <path d="M0 70H1200"/>
    <path d="M0 140H1200"/>
    <path d="M0 210H1200"/>
    <path d="M0 280H1200"/>
    <path d="M150 0V350"/>
    <path d="M300 0V350"/>
    <path d="M450 0V350"/>
    <path d="M600 0V350"/>
    <path d="M750 0V350"/>
    <path d="M900 0V350"/>
    <path d="M1050 0V350"/>
  </g>

  <!-- Terminal Window -->
  <rect x="70" y="55" width="420" height="240" rx="16" fill="#020409" stroke="#1E3448"/>

  <circle cx="105" cy="85" r="8" fill="#FF5F56"/>
  <circle cx="135" cy="85" r="8" fill="#FFBD2E"/>
  <circle cx="165" cy="85" r="8" fill="#27C93F"/>

  <text x="105" y="135" fill="#00FF9C" font-family="monospace" font-size="20">
    &gt; developer.init()
  </text>

  <text x="105" y="170" fill="#8BE9FD" font-family="monospace" font-size="18">
    building secure systems...
  </text>

  <text x="105" y="205" fill="#FFFFFF" font-family="monospace" font-size="18">
    writing clean code_
  </text>

  <text x="105" y="240" fill="#6272A4" font-family="monospace" font-size="16">
    access: authorized
  </text>

  <!-- Shield / Code Icon -->
  <g transform="translate(850 75)" filter="url(#glow)">
    <path d="M120 0L220 35V120C220 180 120 220 120 220C120 220 20 180 20 120V35L120 0Z"
          fill="#071B26"
          stroke="url(#accent)"
          stroke-width="5"/>

    <path d="M80 100L105 125L165 65"
          stroke="#00FF9C"
          stroke-width="10"
          stroke-linecap="round"
          stroke-linejoin="round"/>

    <text x="70" y="165"
          fill="#00C2FF"
          font-family="monospace"
          font-size="22">
      CODE
    </text>
  </g>

  <!-- Main Text -->
  <text x="560" y="135"
        fill="white"
        font-family="Arial, sans-serif"
        font-size="52"
        font-weight="700">
    Developer
  </text>

  <text x="560" y="185"
        fill="url(#accent)"
        font-family="monospace"
        font-size="24">
    secure • creative • innovative
  </text>

  <text x="560" y="225"
        fill="#B8C7D9"
        font-family="Arial, sans-serif"
        font-size="18">
    Crafting software with precision
  </text>

  <text x="560" y="255"
        fill="#B8C7D9"
        font-family="Arial, sans-serif"
        font-size="18">
    exploring systems, code &amp; technology
  </text>

  <!-- Bottom Accent -->
  <rect x="560" y="285" width="300" height="4"
        fill="url(#accent)"
        rx="2"/>

</svg>

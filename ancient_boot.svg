<!-- NoirW01F Dev echo: "Feel free to use and edit" -->

<svg width="1000" height="600" viewBox="0 0 1000 600"
xmlns="http://www.w3.org/2000/svg">

<rect width="1000" height="600" fill="#050505"/>

<!-- CRT glow -->
<rect x="20" y="20" width="960" height="560" rx="12"
fill="#001900" stroke="#00ff66" stroke-width="4"/>

<!-- Scanlines -->
<g opacity="0.12" stroke="#00ff66">
  <path d="M20 80H980"/>
  <path d="M20 120H980"/>
  <path d="M20 160H980"/>
  <path d="M20 200H980"/>
  <path d="M20 240H980"/>
  <path d="M20 280H980"/>
  <path d="M20 320H980"/>
  <path d="M20 360H980"/>
  <path d="M20 400H980"/>
  <path d="M20 440H980"/>
  <path d="M20 480H980"/>
  <path d="M20 520H980"/>
</g>

<!-- Text -->
<g font-family="monospace" fill="#00ff66">

<text x="70" y="110" font-size="32">
  ANCIENT SYSTEMS INC.
</text>

<text x="70" y="155" font-size="22">
  Universal Retro Machine v0.0001
</text>

<text x="70" y="220" font-size="22">
  Checking memory............. OK
</text>

<text x="70" y="260" font-size="22">
  Loading imagination.dll..... OK
</text>

<text x="70" y="300" font-size="22">
  Searching for coffee........ FOUND
</text>

<text x="70" y="340" font-size="22">
  Installing dinosaurs....... 97%
</text>

<text x="70" y="390" font-size="26">
  BOOT SEQUENCE:
</text>

</g>

<!-- Loading bar -->
<rect x="70" y="430" width="700" height="35"
fill="#002b00" stroke="#00ff66" stroke-width="3"/>

<rect x="75" y="435" width="620" height="25"
fill="#00ff66"/>

<text x="790" y="460"
font-family="monospace"
font-size="22"
fill="#00ff66">
88%
</text>

<text x="70" y="520"
font-family="monospace"
font-size="22"
fill="#00ff66">
SYSTEM READY_ 
</text>

<!-- blinking cursor -->
<rect x="260" y="495" width="15" height="25" fill="#00ff66">
  <animate attributeName="opacity"
           values="1;0;1"
           dur="1s"
           repeatCount="indefinite"/>
</rect>

</svg>
